[project]
name = "still-shift-depth-worker"
version = "0.1.0"
description = "Python toolchain scaffold for the future Still Shift depth worker"
requires-python = "==3.12.11"
dependencies = []

[dependency-groups]
dev = [
  "ruff==0.12.10",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
