name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      tier:
        description: Additional checks on the provisioned media runner
        type: choice
        options: [fast, runtime, release]
        default: fast

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:fast

  media:
    if: github.event_name == 'workflow_dispatch' && inputs.tier != 'fast'
    needs: fast
    runs-on: [self-hosted, still-shift-media]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
      - run: pnpm browser:install
      - run: pnpm format:check && pnpm lint
      - if: inputs.tier == 'runtime'
        run: pnpm check:runtime
      - if: inputs.tier == 'release'
        run: pnpm check:all
